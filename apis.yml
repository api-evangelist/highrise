apis:
- name: Highrise Bot API
  description: >-
    WebSocket API for building and running programmable bots inside Highrise rooms. Bots receive a stream
    of room events (chat, emotes, reactions, joins/leaves, movement, tips, voice, DMs, moderation) and
    issue request messages (chat, teleport, moderate, tip, manage voice, buy items, manage backpack/outfit,
    send messages). Official Python and .NET SDKs wrap the protocol.
  humanURL: https://create.highrise.game/learn/guides/bots/creating-a-bot
  baseURL: wss://highrise.game/web/botapi
  tags:
  - Bots
  - WebSocket
  - Event
  - Real-Time
  tags_raw:
  - Bots
  - WebSocket
  - Events
  - Real-time
  properties:
  - type: AsyncAPI
    url: asyncapi/highrise-bot-api-asyncapi.yml
  - type: Webhooks
    url: asyncapi/highrise-bot-api-asyncapi.yml
- name: Highrise Studio (Engine + Cloud API)
  description: >-
