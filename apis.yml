aid: highrise
name: Highrise
description: >-
  Highrise is a mobile-first virtual world by Pocket Worlds Inc where users create avatars, hang
  out in social rooms, design and trade fashion items, and build custom worlds. Alongside the
  consumer app, Highrise operates a developer platform for creators: a WebSocket Bot API for
  running programmable bots inside rooms (official Python and .NET SDKs), a read-only REST Web API
  exposing public users, rooms, posts, items and grabs data, and Highrise Studio with an Engine API
  and Cloud API for scripting worlds and games in Lua. Bots authenticate with an API token minted
  from the Highrise account settings and are bound to a room ID.
