openapi: 3.2.0
info:
  title: Create Users API
  version: '1.0'
tags:
- name: Users
paths:
  /api/users:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsersResponse'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: sort_order
        in: query
        schema:
          type: string
      - name: username
        in: query
        schema:
          type: string
      - name: starts_after
        in: query
        schema:
          type: string
      - name: ends_before
        in: query
        schema:
          type: string
      - name: include_avatar_svg
        in: query
        schema:
          type: boolean
      summary: Invoke Get Users
      tags:
      - Users
      operationId: invoke_get_users
components:
  schemas:
    GetUsersResponse:
      type: object
      properties:
        users:
          items:
            $ref: '#/components/schemas/UserBasic'
          type: array
        total:
          type: integer
        first_id:
          type: string
        last_id:
          type: string
      required:
      - users
      - total
      - first_id
      - last_id
    UserBasic:
      type: object
      properties:
        user_id:
          type: string
        username:
          oneOf:
          - type: string
          - type: 'null'
        created_at:
          oneOf:
          - type: string
          - type: 'null'
        joined_at:
          oneOf:
          - type: string
          - type: 'null'
        last_connect_at:
          oneOf:
          - type: string
          - type: 'null'
        last_activity_at:
          oneOf:
          - type: string
          - type: 'null'
        banned_until:
          oneOf:
          - type: string
          - type: 'null'
        banned:
          type: boolean
        icon_url:
          oneOf:
          - type: string
          - type: 'null'
        avatar_url:
          oneOf:
          - type: string
          - type: 'null'
        avatar_svg:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - user_id
  securitySchemes:
    cookie_hr_s_production:
      name: hr_s_production
      in: cookie
      description: null
      type: apiKey
