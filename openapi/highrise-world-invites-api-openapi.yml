openapi: 3.2.0
info:
  title: Create World Invites API
  version: '1.0'
tags:
- name: world_invites
paths:
  /api/world/{world_id}/invites:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
      parameters:
      - name: world_id
        in: path
        required: true
        schema:
          type: string
      - name: hr_s_production
        in: cookie
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      security:
      - cookie/hr_s_production: []
      summary: Get Invites For World
      tags:
      - world_invites
      operationId: get_invites_for_world
  /api/world/{world_id}/invites/{member_id}:
    put:
      responses:
        '204':
          description: No content
      parameters:
      - name: world_id
        in: path
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        required: true
        schema:
          type: string
      - name: hr_s_production
        in: cookie
        schema:
          type: string
      security:
      - cookie/hr_s_production: []
      summary: Invite User To World
      tags:
      - world_invites
      operationId: invite_user_to_world
    delete:
      responses:
        '204':
          description: No content
      parameters:
      - name: world_id
        in: path
        required: true
        schema:
          type: string
      - name: member_id
        in: path
        required: true
        schema:
          type: string
      - name: hr_s_production
        in: cookie
        schema:
          type: string
      security:
      - cookie/hr_s_production: []
      summary: Cancel World Invite
      tags:
      - world_invites
      operationId: cancel_world_invite
  /api/world/{world_id}/invites/accept:
    post:
      responses:
        '204':
          description: No content
      parameters:
      - name: world_id
        in: path
        required: true
        schema:
          type: string
      - name: hr_s_production
        in: cookie
        schema:
          type: string
      security:
      - cookie/hr_s_production: []
      summary: Accept World Invite
      tags:
      - world_invites
      operationId: accept_world_invite
  /api/world/{world_id}/invites/reject:
    delete:
      responses:
        '204':
          description: No content
      parameters:
      - name: world_id
        in: path
        required: true
        schema:
          type: string
      - name: hr_s_production
        in: cookie
        schema:
          type: string
      security:
      - cookie/hr_s_production: []
      summary: Reject World Invite
      tags:
      - world_invites
      operationId: reject_world_invite
components:
  schemas:
    WorldRole:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
        system_permissions:
          type: integer
        world_permissions:
          items:
            type: string
          type: array
      required:
      - name
      - order
      - system_permissions
      - world_permissions
    User:
      type: object
      properties:
        username:
          type: string
        primary_role:
          oneOf:
          - $ref: '#/components/schemas/WorldRole'
          - type: 'null'
        roles:
          oneOf:
          - type: 'null'
        avatar_key:
          oneOf:
          - type: string
          - type: 'null'
        icon_key:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - username
    MemberPage:
      type: object
      properties:
        elements:
          items:
            $ref: '#/components/schemas/User'
          type: array
        has_more:
          type: boolean
      required:
      - elements
      - has_more
  securitySchemes:
    cookie_hr_s_production:
      name: hr_s_production
      in: cookie
      description: null
      type: apiKey
x-provenance:
  method: harvested
  publisher: Highrise
  source: https://create.highrise.game/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
